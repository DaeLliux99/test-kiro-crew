<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Mis Tareas</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        class="todo-input"
        placeholder="¿Qué necesitas hacer?"
        aria-label="Nueva tarea"
        required
      >
      <button type="submit" class="add-btn">Agregar</button>
    </form>

    <div class="filters" role="group" aria-label="Filtrar tareas">
      <button class="filter-btn active" data-filter="all">Todas</button>
      <button class="filter-btn" data-filter="active">Pendientes</button>
      <button class="filter-btn" data-filter="completed">Completadas</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="app-footer">
      <span id="items-left">0 tareas pendientes</span>
      <button id="clear-completed" class="clear-btn">Limpiar completadas</button>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
